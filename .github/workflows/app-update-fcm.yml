name: Notify LibertyBoard app update

on:
  push:
    branches:
      - main
    paths:
      - 'LibertyBoard.apk'
      - 'version.json'
      - 'downloads/LibertyBoard.apk'
      - 'downloads/version.json'
      - '.github/workflows/app-update-fcm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-app-update:
    name: notify-app-update
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_URL: https://borinet-dev.github.io/downloads
      APP_UPDATE_TOPIC: app_update

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find update files
        id: files
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "LibertyBoard.apk" ] && [ -f "version.json" ]; then
            apk_file="LibertyBoard.apk"
            version_file="version.json"
          elif [ -f "downloads/LibertyBoard.apk" ] && [ -f "downloads/version.json" ]; then
            apk_file="downloads/LibertyBoard.apk"
            version_file="downloads/version.json"
          else
            echo "::error::LibertyBoard.apk/version.json 파일을 찾지 못했습니다."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "apk_file=${apk_file}" >> "$GITHUB_OUTPUT"
          echo "version_file=${version_file}" >> "$GITHUB_OUTPUT"
          echo "public_apk_url=${PUBLIC_BASE_URL}/LibertyBoard.apk" >> "$GITHUB_OUTPUT"
          echo "public_version_url=${PUBLIC_BASE_URL}/version.json" >> "$GITHUB_OUTPUT"
          echo "APK file: ${apk_file}"
          echo "Version file: ${version_file}"

      - name: Read latest version code
        id: version
        shell: bash
        env:
          VERSION_FILE: ${{ steps.files.outputs.version_file }}
        run: |
          set -euo pipefail

          latest_version_code=$(python3 -c 'import json, os; f=os.environ["VERSION_FILE"]; data=json.load(open(f, "r", encoding="utf-8")); print(str(data.get("latestVersionCode") or data.get("latest_version_code") or data.get("versionCode") or data.get("version_code") or "").strip())')

          if [ -z "$latest_version_code" ]; then
            echo "::error::version.json에서 latestVersionCode를 찾지 못했습니다."
            cat "$VERSION_FILE"
            exit 1
          fi

          echo "latest_version_code=${latest_version_code}" >> "$GITHUB_OUTPUT"
          echo "Latest version code: ${latest_version_code}"

      - name: Wait until GitHub Pages serves the new APK and version.json
        shell: bash
        env:
          APK_FILE: ${{ steps.files.outputs.apk_file }}
          VERSION_FILE: ${{ steps.files.outputs.version_file }}
          PUBLIC_APK_URL: ${{ steps.files.outputs.public_apk_url }}
          PUBLIC_VERSION_URL: ${{ steps.files.outputs.public_version_url }}
        run: |
          set -euo pipefail

          local_apk_sha=$(sha256sum "$APK_FILE" | awk '{print $1}')
          local_version_sha=$(sha256sum "$VERSION_FILE" | awk '{print $1}')

          echo "Local APK SHA256: ${local_apk_sha}"
          echo "Local version.json SHA256: ${local_version_sha}"

          for attempt in $(seq 1 60); do
            echo "Publish check attempt ${attempt}/60"

            apk_ok=0
            version_ok=0

            if curl -fsSL -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/remote-LibertyBoard.apk" "${PUBLIC_APK_URL}?v=${GITHUB_SHA}-${attempt}"; then
              remote_apk_sha=$(sha256sum "$RUNNER_TEMP/remote-LibertyBoard.apk" | awk '{print $1}')
              echo "Remote APK SHA256: ${remote_apk_sha}"
              if [ "$remote_apk_sha" = "$local_apk_sha" ]; then
                apk_ok=1
              fi
            else
              echo "APK is not available yet."
            fi

            if curl -fsSL -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/remote-version.json" "${PUBLIC_VERSION_URL}?v=${GITHUB_SHA}-${attempt}"; then
              remote_version_sha=$(sha256sum "$RUNNER_TEMP/remote-version.json" | awk '{print $1}')
              echo "Remote version.json SHA256: ${remote_version_sha}"
              if [ "$remote_version_sha" = "$local_version_sha" ]; then
                version_ok=1
              fi
            else
              echo "version.json is not available yet."
            fi

            if [ "$apk_ok" = "1" ] && [ "$version_ok" = "1" ]; then
              echo "GitHub Pages is serving the new files."
              exit 0
            fi

            sleep 10
          done

          echo "::error::GitHub Pages 배포가 10분 안에 완료되지 않았거나 공개 파일이 커밋 파일과 일치하지 않습니다."
          exit 1

      - name: Check Firebase service account secret
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::error::GitHub Secret FIREBASE_SERVICE_ACCOUNT_JSON 값이 비어 있습니다."
            exit 1
          fi

      - name: Read Firebase project id
        id: firebase
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          service_account_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$service_account_file"
          project_id=$(SERVICE_ACCOUNT_FILE="$service_account_file" python3 -c 'import json, os; print(json.load(open(os.environ["SERVICE_ACCOUNT_FILE"], "r", encoding="utf-8"))["project_id"])')
          echo "project_id=${project_id}" >> "$GITHUB_OUTPUT"
          echo "Firebase project id: ${project_id}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build FCM payload
        shell: bash
        env:
          LATEST_VERSION_CODE: ${{ steps.version.outputs.latest_version_code }}
          APK_URL: ${{ steps.files.outputs.public_apk_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          latest_version_code = os.environ["LATEST_VERSION_CODE"].strip()
          apk_url = os.environ["APK_URL"].strip()

          payload = {
              "message": {
                  "topic": "app_update",
                  "android": {
                      "priority": "HIGH"
                  },
                  "data": {
                      "type": "app_update",
                      "title": "리버티 게시판 앱 업데이트",
                      "body": "새 버전이 등록되었습니다. 업데이트 후 이용해 주세요.",
                      "apk_url": apk_url,
                      "apkUrl": apk_url,
                      "latest_version_code": latest_version_code,
                      "latestVersionCode": latest_version_code
                  }
              }
          }

          with open(os.environ["RUNNER_TEMP"] + "/fcm-payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY
          cat "$RUNNER_TEMP/fcm-payload.json"

      - name: Send FCM app update topic message
        shell: bash
        env:
          PROJECT_ID: ${{ steps.firebase.outputs.project_id }}
        run: |
          set -euo pipefail

          access_token=$(gcloud auth print-access-token)
          response_file="$RUNNER_TEMP/fcm-response.json"
          http_code=$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST "https://fcm.googleapis.com/v1/projects/${PROJECT_ID}/messages:send" \
            -H "Authorization: Bearer ${access_token}" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary "@$RUNNER_TEMP/fcm-payload.json")

          echo "FCM status=${http_code}"
          cat "$response_file"

          if [ "$http_code" != "200" ]; then
            echo "::error::FCM 발송 실패"
            exit 1
          fi
